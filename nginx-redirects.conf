# 307 redirects for CTA links (nginx). Include inside the site's server { } block.
location ~ ^/registration/?$ { return 307 https://vodds.com/#register; }
location ~ ^/login/?$        { return 307 https://vodds.com/#login; }
location ~ ^/promotions/?$   { return 307 https://vodds.com/promotions/; }
location ~ ^/casino/?$       { return 307 https://vodds.com/online-casino/; }
